name: Publish wiki
# Mirrors docs/wiki/*.md (except README.md) and docs/wiki/images/ into the GitHub wiki of this
# repository. Pages reference the images relatively as images/<file>.
# The wiki must have been initialised once in the web UI (create the Home page).
# Only `main` (and a manual run) may write to the live wiki - never unmerged work branches.
on:
  push:
    branches: [main]
    paths: ["docs/wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wiki
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Push docs/wiki to the wiki repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          find wiki -maxdepth 1 -name '*.md' -delete
          for f in docs/wiki/*.md; do
            [ "$(basename "$f")" = "README.md" ] || cp "$f" wiki/
          done
          # Images: replace the whole folder so files removed from docs/wiki/images disappear too.
          rm -rf wiki/images
          if [ -d docs/wiki/images ]; then
            cp -R docs/wiki/images wiki/images
          fi
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "Sync wiki from ${GITHUB_SHA::7}"
            git push origin HEAD
          fi
