name: Portable
# Builds the portable ZIP (scripts/build_portable.ps1) on Windows, smoke-tests it (also after
# moving it to another drive), compiles the per-user installer (installer/HCLoader.iss, Inno
# Setup 6) from the same files and smoke-tests install/upgrade/uninstall; both are uploaded as
# workflow artifacts. On a tag `v*` the job `release` attaches the portable ZIP, the installer,
# a source ZIP and SHA256SUMS to the GitHub release (self-update, docs/RELEASING.md); only that
# job may write.
on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # like ci.yml: a running build finishes; of the waiting runs only the newest is kept
  group: portable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        # Windows PowerShell 5.1 = the shell the user runs the build script with
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Build (dist\HCLoader + ZIP)
        id: build
        timeout-minutes: 30
        run: .\scripts\build_portable.ps1 -Zip

      - name: "Installer: compile (Inno Setup 6) from the portable ZIP"
        id: installer
        timeout-minutes: 25
        run: |
          # native tools may write to stderr: only exit codes decide (PS 5.1, runner sets 'stop')
          $ErrorActionPreference = 'Continue'
          $ws = $env:GITHUB_WORKSPACE
          $ver = '${{ steps.build.outputs.version }}'
          $num = ($ver -split '[-+]')[0]   # VersionInfoVersion: numbers only
          # exactly the files of the portable ZIP (the build folder collects __pycache__, data\
          # and pytest in the smoke steps below); the .iss drops portable.txt and data\
          $src = Join-Path $env:RUNNER_TEMP 'inst-src'
          if (Test-Path $src) { cmd.exe /d /c "rmdir /s /q `"\\?\$src`"" }
          New-Item -ItemType Directory -Path $src -ErrorAction Stop | Out-Null
          Expand-Archive -Path '${{ steps.build.outputs.zip }}' -DestinationPath $src -ErrorAction Stop
          $app = Join-Path $src 'HCLoader'
          if (-not (Test-Path (Join-Path $app 'python\pythonw.exe'))) { throw "python\pythonw.exe fehlt in $app" }
          # MAX_PATH: default install folder + '\' + longest relative path must stay <= 259
          $py = Join-Path $app 'python\python.exe'
          $out = & $py (Join-Path $ws 'scripts\portable_tools.py') longest $app
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $rel = [int]("$out".Trim())
          if ($rel -le 0) { throw "Laengster Pfad nicht ermittelt: $out" }
          $default = Join-Path $env:LOCALAPPDATA 'Programs\HCLoader'
          $total = $default.Length + 1 + $rel
          Write-Host "Laengster relativer Pfad: $rel Zeichen; $default + $rel = $total (Grenze 259)"
          if ($total -gt 259) { throw "MAX_PATH: $default + $rel Zeichen = $total > 259" }
          # headroom for the user name in C:\Users\<name>\AppData\Local\Programs\HCLoader\
          $budget = 259 - 1 - $rel - ('C:\Users\\AppData\Local\Programs\HCLoader').Length
          if ($budget -lt 20) { Write-Host "::warning::Installer: Benutzernamen nur bis $budget Zeichen passen in den Standardordner (MAX_PATH)" }
          else { Write-Host "Benutzernamen bis $budget Zeichen passen in den Standardordner" }
          # Inno Setup 6: preinstalled on windows-latest, else Chocolatey
          $cands = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe (Inno Setup 6) nicht gefunden' }
          Write-Host "ISCC: $iscc"
          $dest = Join-Path $ws 'dist\installer'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          & $iscc /Qp "/DAppVersion=$ver" "/DAppVersionNumeric=$num" "/DSourceDir=$app" "/DOutputDir=$dest" "/DMaxRelPath=$rel" (Join-Path $ws 'installer\HCLoader.iss')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $exe = Join-Path $dest "HCLoader-Setup-$ver.exe"
          if (-not (Test-Path $exe)) { throw "Installer fehlt: $exe" }
          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Installer: $exe ($sizeMb MB)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe=$exe" -Encoding ASCII
          cmd.exe /d /c "rmdir /s /q `"\\?\$src`""

      - name: "Smoke (a): imports, portable mode, no links left"
        timeout-minutes: 5
        run: |
          # native tools may write to stderr: only exit codes decide (PS 5.1, runner sets 'stop')
          $ErrorActionPreference = 'Continue'
          $root = Join-Path $env:GITHUB_WORKSPACE 'dist\HCLoader'
          $py = Join-Path $root 'python\python.exe'
          Set-Location $env:RUNNER_TEMP  # cwd must not matter (._pth: cwd is not on sys.path)
          & $py -c "import app, app.main, webview, yt_dlp, mutagen, pydantic; print('imports ok', app.__file__)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -c "from app.core import config, maintenance; assert config.is_portable(); assert maintenance.is_portable_python(); print('data', config.app_home())"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -c "import clr; clr.AddReference('System.Windows.Forms'); import webview.platforms.winforms as w; print('pythonnet ok, renderer', w.renderer)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $links = @(Get-ChildItem -Path $root -Recurse -Force -Attributes ReparsePoint -ErrorAction SilentlyContinue)
          if ($links.Count -gt 0) { $links | Select-Object -First 10 | ForEach-Object { Write-Host $_.FullName }; throw "Links im Build: $($links.Count)" }

      - name: "Smoke (b): app.main --help"
        timeout-minutes: 2
        run: |
          # native tools may write to stderr: only exit codes decide (PS 5.1, runner sets 'stop')
          $ErrorActionPreference = 'Continue'
          $py = Join-Path $env:GITHUB_WORKSPACE 'dist\HCLoader\python\python.exe'
          Set-Location $env:RUNNER_TEMP
          & $py -m app.main --help
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: "Smoke (c): pytest in the embedded Python (dev deps only here, not in the ZIP)"
        timeout-minutes: 15
        env:
          HCLOADER_NO_DIALOG: "1"  # never a modal MessageBox in CI (tests/conftest.py sets it too)
        run: |
          # native tools may write to stderr: only exit codes decide (PS 5.1, runner sets 'stop')
          $ErrorActionPreference = 'Continue'
          $py = Join-Path $env:GITHUB_WORKSPACE 'dist\HCLoader\python\python.exe'
          & $py -m pip install --no-warn-script-location --disable-pip-version-check pytest pytest-timeout
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Location $env:GITHUB_WORKSPACE
          & $py -m pytest -q -p no:cacheprovider --timeout=120 --timeout-method=thread -o faulthandler_timeout=110
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: "Smoke (d): unpack the ZIP on another drive, remove the build folder"
        timeout-minutes: 15
        run: |
          # native tools may write to stderr: only exit codes decide (PS 5.1, runner sets 'stop')
          $ErrorActionPreference = 'Continue'
          $ws = $env:GITHUB_WORKSPACE
          # another drive than the workspace if there is one (windows-latest: workspace on D:)
          $drive = 'D:\'
          if ($ws.StartsWith('D:', [StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path 'D:\')) { $drive = 'C:\' }
          $moved = Join-Path $drive 'moved'
          if (Test-Path $moved) { cmd.exe /d /c "rmdir /s /q `"\\?\$moved`"" }
          New-Item -ItemType Directory -Path $moved -ErrorAction Stop | Out-Null
          Expand-Archive -Path '${{ steps.build.outputs.zip }}' -DestinationPath $moved -ErrorAction Stop
          # the old location must be gone: absolute paths/links to it would otherwise still work
          $old = Join-Path $ws 'dist\HCLoader'
          cmd.exe /d /c "rmdir /s /q `"\\?\$old`""
          if (Test-Path $old) { throw "Build-Ordner nicht entfernt: $old" }
          $root = Join-Path $moved 'HCLoader'
          "HCL_MOVED=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path (Join-Path $root 'data')) { throw 'data\ darf nicht im ZIP liegen' }
          foreach ($f in @('HCLoader.cmd', 'HCLoader.vbs', 'HCLoader-Konsole.cmd', 'Verknuepfung-erstellen.cmd', 'portable.txt', 'THIRD_PARTY_LICENSES.txt', 'licenses\ffmpeg\BUILDINFO.txt', 'licenses\python\LICENSE.txt', 'licenses\deno\LICENSE.md', 'scripts\run_watchlist.pyw', 'bin\deno.exe', 'bin\ffmpeg.exe', 'bin\ffprobe.exe')) {
            if (-not (Test-Path (Join-Path $root $f))) { throw "fehlt im ZIP: $f" }
          }
          $py = Join-Path $root 'python\python.exe'
          Set-Location $env:RUNNER_TEMP
          & $py -c "import app, app.main, webview, yt_dlp, mutagen, pydantic; print('imports ok', app.__file__)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -m app.main --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -c "import os, sys; from app.core import config, maintenance; r = os.path.normcase(sys.argv[1]); assert os.path.normcase(str(config.app_root())) == r, config.app_root(); assert maintenance.is_portable_python(); print('data', config.app_home())" $root
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -c "import pytest" 2>$null
          $leak = $LASTEXITCODE
          if ($leak -eq 0) { throw 'pytest steckt im ZIP (Dev-Abhaengigkeiten duerfen nicht hinein)' }
          exit 0

      - name: "Smoke (e): deno + bgutil provider after moving (fresh Deno cache)"
        timeout-minutes: 10
        run: |
          # native tools may write to stderr: only exit codes decide (PS 5.1, runner sets 'stop')
          $ErrorActionPreference = 'Continue'
          $root = $env:HCL_MOVED
          $env:DENO_DIR = Join-Path $env:RUNNER_TEMP 'deno-fresh'   # like another PC: empty cache
          $env:DENO_NO_UPDATE_CHECK = '1'
          $deno = Join-Path $root 'bin\deno.exe'
          $server = Join-Path $root 'bin\bgutil-pot-provider\server'
          $nm = Join-Path $server 'node_modules'
          # same cache dir as the plugin and app/core/potoken.py (XDG_CACHE_HOME, else USERPROFILE\.cache)
          $env:XDG_CACHE_HOME = Join-Path $env:RUNNER_TEMP 'xdg-cache'
          $cache = Join-Path $env:XDG_CACHE_HOME 'bgutil-ytdlp-pot-provider'
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          Set-Location $env:RUNNER_TEMP
          # same check as app/core/potoken.py (and the plugin itself): generate_once.ts --version
          & $deno run --allow-env --allow-net "--allow-ffi=$nm" "--allow-write=$cache" "--allow-read=$cache,$nm" (Join-Path $server 'src\generate_once.ts') --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # the native addon jsdom loads lazily (not part of --version): require it like jsdom does
          $probe = Join-Path $env:RUNNER_TEMP 'canvas_probe.mjs'
          Set-Content -Path $probe -Encoding ASCII -Value @(
            "import { createRequire } from 'node:module';",
            "import { pathToFileURL } from 'node:url';",
            "const req = createRequire(pathToFileURL(Deno.args[0]));",
            "const c = req('canvas').createCanvas(8, 8);",
            "console.log('canvas ok', c.width);"
          )
          & $deno run --allow-env "--allow-ffi=$nm" "--allow-read=$nm" $probe (Join-Path $nm 'jsdom\package.json')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $py = Join-Path $root 'python\python.exe'
          # static check at the new place: no links, every locked dependency resolvable (Node walk-up)
          & $py (Join-Path $root 'scripts\hoisted_node_modules.py') check $server --native canvas
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -c "import sys; from app.core import binaries, potoken; s = binaries.status(); print(s); r = potoken.probe('script', 4416); print(r); sys.exit(0 if (r['ok'] and s['deno_ok'] and s['ffmpeg_ok'] and s['provider_dir_ok']) else 1)"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: "Smoke (f): installer - silent install, data in APPDATA, upgrade, uninstall"
        timeout-minutes: 20
        run: |
          # native tools may write to stderr: only exit codes decide (PS 5.1, runner sets 'stop')
          $ErrorActionPreference = 'Continue'
          $exe = '${{ steps.installer.outputs.exe }}'
          $dir = Join-Path $env:RUNNER_TEMP 'HCLoader-installed'
          $taskName = 'HCLoader-Watchlist'   # app/core/scheduler.py TASK_NAME
          Remove-Item Env:HCLOADER_HOME -ErrorAction SilentlyContinue   # app_home must resolve itself
          if (Test-Path $dir) { cmd.exe /d /c "rmdir /s /q `"\\?\$dir`"" }
          function Invoke-Setup([string]$Log) {
            $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"", "/LOG=`"$Log`"")
            if (Test-Path $Log) { Get-Content -Path $Log -Tail 25 | ForEach-Object { Write-Host "    $_" } }
            if ($p.ExitCode -ne 0) { throw "Setup fehlgeschlagen (Exitcode $($p.ExitCode))" }
          }
          Invoke-Setup (Join-Path $env:RUNNER_TEMP 'hcl-setup-1.log')
          foreach ($f in @('python\python.exe', 'python\pythonw.exe', 'app\main.py', 'ui\index.html', 'ui\img\hcloader.ico', 'scripts\apply_update.ps1', 'scripts\fetch_binaries.ps1', 'scripts\run_watchlist.pyw', 'bin\deno.exe', 'bin\ffmpeg.exe', 'bin\ffprobe.exe', 'THIRD_PARTY_LICENSES.txt', 'licenses\python\LICENSE.txt', 'unins000.exe')) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "fehlt in der Installation: $f" }
          }
          if (Test-Path (Join-Path $dir 'portable.txt')) { throw 'portable.txt darf nicht installiert werden' }
          if (Test-Path (Join-Path $dir 'data')) { throw 'data\ darf nicht installiert werden' }
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\HCLoader.lnk'
          if (-not (Test-Path $lnk)) { throw "Startmenue-Verknuepfung fehlt: $lnk" }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Host "Verknuepfung: $($sc.TargetPath) $($sc.Arguments) (in $($sc.WorkingDirectory))"
          if ($sc.TargetPath -ne (Join-Path $dir 'python\pythonw.exe') -or $sc.Arguments -ne '-X utf8 -m app.main' -or $sc.WorkingDirectory -ne $dir) { throw 'Startmenue-Verknuepfung zeigt falsch' }
          $desk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'HCLoader.lnk'
          if (Test-Path $desk) { throw 'Desktop-Verknuepfung ist eine Option (Standard: aus)' }
          # same import/binaries smoke as the portable copy, with the installed Python
          $py = Join-Path $dir 'python\python.exe'
          Set-Location $env:RUNNER_TEMP
          & $py -c "import app, app.main, webview, yt_dlp, mutagen, pydantic; print('imports ok', app.__file__)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -m app.main --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # installed copy: no portable mode, data in %APPDATA%\HCLoader, self-update like portable
          & $py -c "import os, sys; from pathlib import Path; from app.core import config, maintenance, selfupdate; n = lambda p: os.path.normcase(str(p)); r = Path(sys.argv[1]); assert n(config.app_root()) == n(r), config.app_root(); assert not config.is_portable(); home = Path(os.environ['APPDATA']) / 'HCLoader'; assert n(config.app_home()) == n(home), config.app_home(); assert maintenance.is_embedded_python() and maintenance.is_installed_python() and not maintenance.is_portable_python(); rt = selfupdate.detect_runtime(config.app_root()); assert rt.mode == 'installed', rt; assert selfupdate.is_installed_copy(r); print('data', config.app_home(), rt)" $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:DENO_DIR = Join-Path $env:RUNNER_TEMP 'deno-installed'
          $env:DENO_NO_UPDATE_CHECK = '1'
          $env:XDG_CACHE_HOME = Join-Path $env:RUNNER_TEMP 'xdg-cache-installed'
          New-Item -ItemType Directory -Path (Join-Path $env:XDG_CACHE_HOME 'bgutil-ytdlp-pot-provider') -Force | Out-Null
          & $py (Join-Path $dir 'scripts\hoisted_node_modules.py') check (Join-Path $dir 'bin\bgutil-pot-provider\server') --native canvas
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -c "import sys; from app.core import binaries, potoken; s = binaries.status(); print(s); r = potoken.probe('script', 4416); print(r); sys.exit(0 if (r['ok'] and s['deno_ok'] and s['ffmpeg_ok'] and s['provider_dir_ok']) else 1)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # upgrade over the existing install: program folders are replaced, old update backups go
          New-Item -ItemType Directory -Path (Join-Path $dir '_previous') -Force | Out-Null
          Set-Content -Path (Join-Path $dir '_previous\marker.txt') -Value 'x'
          Set-Content -Path (Join-Path $dir 'app\stale_module.py') -Value '# old'
          Invoke-Setup (Join-Path $env:RUNNER_TEMP 'hcl-setup-2.log')
          if (Test-Path (Join-Path $dir '_previous')) { throw 'Upgrade: _previous nicht entfernt' }
          if (Test-Path (Join-Path $dir 'app\stale_module.py')) { throw 'Upgrade: alte Programmdatei liegt noch da' }
          if (-not (Test-Path (Join-Path $dir 'app\main.py'))) { throw 'Upgrade: app\main.py fehlt' }
          & $py -c "import app.main; print('upgrade ok')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # uninstall: removes the app folder (also files created later) and the scheduled task of
          # this copy, never %APPDATA%\HCLoader
          $data = Join-Path $env:APPDATA 'HCLoader'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          Set-Content -Path (Join-Path $data 'keep-me.txt') -Value 'user data'
          New-Item -ItemType Directory -Path (Join-Path $dir '_previous-20260101-000000\app') -Force | Out-Null
          $task = $null
          try {
            $action = New-ScheduledTaskAction -Execute (Join-Path $dir 'python\pythonw.exe') -Argument ('"' + (Join-Path $dir 'scripts\run_watchlist.pyw') + '"') -WorkingDirectory $dir
            $trigger = New-ScheduledTaskTrigger -Daily -At '03:00'
            $task = Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Force -ErrorAction Stop
          }
          catch { Write-Host "::warning::Testaufgabe nicht anlegbar, Aufgaben-Pruefung uebersprungen: $_" }
          $p = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          Write-Host "Deinstallation: Exitcode $($p.ExitCode)"
          # the uninstaller continues from a temporary copy: wait until the folder is gone
          $deadline = (Get-Date).AddMinutes(5)
          while ((Test-Path $dir) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 2 }
          if (Test-Path $dir) {
            Get-ChildItem -Path $dir -Force -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "    $($_.FullName)" }
            throw "App-Ordner nach der Deinstallation noch da: $dir"
          }
          if (-not (Test-Path (Join-Path $data 'keep-me.txt'))) { throw 'Deinstallation hat %APPDATA%\HCLoader angefasst' }
          if (Test-Path $lnk) { throw 'Startmenue-Verknuepfung nach der Deinstallation noch da' }
          if ($task -and (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue)) {
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            throw 'Deinstallation hat die geplante Aufgabe nicht entfernt'
          }
          Remove-Item -Path $data -Recurse -Force -ErrorAction SilentlyContinue
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCLoader-portable-${{ steps.build.outputs.version }}-win64
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error
          compression-level: 0  # already a ZIP
          retention-days: 30

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCLoader-Setup-${{ steps.build.outputs.version }}-win64
          path: ${{ steps.installer.outputs.exe }}
          if-no-files-found: error
          compression-level: 0  # LZMA2 inside
          retention-days: 30

  release:
    # only for tags: attach the assets to the release (create it from CHANGELOG.md if missing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # gh uses GH_TOKEN; git only reads (git archive)

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Assets (installer, source ZIP, SHA256SUMS)
        id: assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          app_ver=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('app/__init__.py').read()).group(1))")
          if [ "$ver" != "$app_ver" ]; then echo "Tag $TAG passt nicht zu app/__init__.py ($app_ver)"; exit 1; fi
          mkdir -p out
          find dist-artifacts \( -name '*.zip' -o -name '*.exe' \) -exec cp {} out/ \;
          test -f "out/HCLoader-Setup-$ver.exe" || { echo "Installer HCLoader-Setup-$ver.exe fehlt"; exit 1; }
          git archive --format=zip --prefix="HCLoader-$ver/" -o "out/HCLoader-$ver-source.zip" "$TAG"
          (cd out && sha256sum *.zip *.exe > SHA256SUMS && cat SHA256SUMS)
          python3 - "$ver" > out/notes.md <<'PY'
          import re, sys
          v = re.escape(sys.argv[1])
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^##[ \t]*\[?v?{v}\]?(?:[ \t].*)?$", text, re.M)
          if m:
              rest = text[m.end():]
              n = re.search(r"^##\s", rest, re.M)
              print(rest[: n.start() if n else len(rest)].strip())
          PY
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            flags=()
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" --verify-tag --title "HCLoader $TAG" --notes-file out/notes.md "${flags[@]}"
          fi
          gh release upload "$TAG" out/*.zip out/*.exe out/SHA256SUMS --clobber
