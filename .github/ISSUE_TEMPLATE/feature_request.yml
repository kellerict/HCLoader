name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        HCLoader is a personal-use tool that is deliberately gentle with the platforms it talks to.
        Requests that would bypass the throttle, add parallel downloads or retry loops, or make
        redistribution easier will not be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Discover / search
        - Watchlist / Inbox
        - Downloads / queue
        - Library / player
        - Tags / file naming
        - Settings
        - Sources (SoundCloud, Mixcloud, ...)
        - Install / portable build
        - Other
