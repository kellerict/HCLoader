# HCLoader – known artists (v0.8.0, app/core/artists.py)
# Seeded once into the database (table `artists`); afterwards the user's edits win and an
# update never overwrites them. `aliases`: other spellings or short names that mean the same
# artist. A name with a joiner (&, x, vs) listed here is one act and never counted as a b2b.
# Spelling variants that only differ in spaces, hyphens, dots or case («Sub-Zero Project»,
# «SubZero Project») need no alias: they fold to the same key anyway.
format: 1
