# Built-in festivals and series (v0.3.0, docs/concepts/festivals.md).
#
# Shipped with the app and synchronised into the database (table `series`) at start-up.
# Users edit their copy in Settings > Festivals & series; an entry the user changed, hid or added
# is never overwritten by an update of this file (app/core/series.py `sync_builtin`).
#
# Language-neutral data only: names are proper names, `set_types.code` is the stable code the UI
# translates, `label` is the language-neutral text written into tags (TXXX:SET_TYPE).
#
# series:
#   key           stable id (never change it once shipped; user series get `u-<slug>`)
#   name          display name, also always an alias
#   kind          festival | radio | podcast
#   aliases       strong spellings: one hit in the title is good evidence
#   weak_aliases  common words (Rebirth, Supremacy …): count less unless directly followed by a year
#   channels      organiser channels (channel id, channel URL or exact channel name) - boost only
#   variants      edition variants such as «Australia»: [{name, aliases}]
#   default_genre genre name used when the genre would otherwise be «Unsortiert» (only for
#                 single-genre series: most festivals have hardstyle AND hardcore stages)
#
# Matching ignores case, accents and punctuation ("Defqon.1" = "Defqon 1" = "DEFQON1").
version: 1

series:
  # ------------------------------------------------------------------ festivals (hardstyle)
  - key: defqon1
    name: Defqon.1
    kind: festival
    aliases: [Defqon.1, Defqon 1, Defqon One, Defqon.1 Weekend Festival, DQ1]
    channels: [Q-dance]
    variants:
      - {name: Australia, aliases: [Australia, AU]}
      - {name: Chile, aliases: [Chile]}
      - {name: at Home, aliases: [at Home]}
  - key: qlimax
    name: Qlimax
    kind: festival
    aliases: [Qlimax]
    channels: [Q-dance]
  - key: x-qlusive
    name: X-Qlusive
    kind: festival
    aliases: [X-Qlusive, XQlusive, X Qlusive]
    channels: [Q-dance]
  - key: q-base
    name: Q-BASE
    kind: festival
    aliases: [Q-BASE, QBASE, Q BASE]
    channels: [Q-dance]
  - key: qapital
    name: Qapital
    kind: festival
    aliases: [Qapital]
    channels: [Q-dance]
  - key: the-qontinent
    name: The Qontinent
    kind: festival
    aliases: [The Qontinent, Qontinent]
  - key: decibel-outdoor
    name: Decibel outdoor
