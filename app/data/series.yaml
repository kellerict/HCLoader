# Stage names (language-neutral). Matched as a separate title segment ("… | RED | …"), as
# "<name> stage", or as an all-caps word in a mixed-case title.
stages:
  - {name: RED, aliases: [Red]}
  - {name: BLUE, aliases: [Blue]}
  - {name: BLACK, aliases: [Black]}
  - {name: UV, aliases: [UV]}
  - {name: YELLOW, aliases: [Yellow]}
  - {name: INDIGO, aliases: [Indigo]}
  - {name: MAGENTA, aliases: [Magenta]}
  - {name: GOLD, aliases: [Gold]}
  - {name: SILVER, aliases: [Silver]}
  - {name: PURPLE, aliases: [Purple]}
  - {name: GREEN, aliases: [Green]}
  - {name: ORANGE, aliases: [Orange]}
  - {name: WHITE, aliases: [White]}
  - {name: PINK, aliases: [Pink]}
  - {name: Mainstage, aliases: [Mainstage, Main stage]}

# Set types: `code` is stable (the UI translates it), `label` goes into TXXX:SET_TYPE.
# The first matching entry wins, so specific phrases come first.
set_types:
  - code: closing_ceremony
    label: Closing Ceremony
    keywords: [closing ceremony, closing show, the closing]
  - code: opening
    label: Opening
    keywords: [opening ceremony, opening show, opening]
  - code: endshow
    label: Endshow
    keywords: [endshow, end show]
  - code: full_show
    label: Full Show
    keywords: [live registration, full show, full event, full concert]
  - code: warm_up
    label: Warm-up
    keywords: [warm up, warm-up, warmup]
  - code: anthem
    label: Anthem
    keywords: [anthem, official anthem]
  - code: live_set
    label: Live Set
    keywords: [live set, liveset, dj set, full set, live stream set, livestream set]
  - code: episode
    label: Episode
    keywords: [episode]

# Words that make a festival assignment unlikely (videos about the festival, not sets).
negative_keywords:
  - remake
  - recreation
  - bootleg
  - cover
  - reaction
  - tutorial
  - how to
  - trailer
  - aftermovie
  - teaser
  - line up
  - lineup
  - timetable
  - tickets
  - ticket
  - announcement
  - vlog
  - documentary
  - making of
  - interview
  - sample pack
  - drum kit
  - fl studio
  - ableton
  - unboxing
