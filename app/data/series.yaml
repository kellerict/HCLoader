    weak_aliases: [Intents]
  - key: hardshock
    name: Hardshock
    kind: festival
    aliases: [Hardshock, Hardshock festival]
  - key: loudness
    name: Loudness
    kind: festival
    aliases: [Loudness festival]
    weak_aliases: [Loudness]
  - key: snowtopia
    name: Snowtopia
    kind: festival
    aliases: [Snowtopia]
  - key: free-festival
    name: Free Festival
    kind: festival
    aliases: [Free Festival]
  - key: wish-outdoor
    name: Wish Outdoor
    kind: festival
