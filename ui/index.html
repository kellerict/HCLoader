<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Zweitverteidigung zum konsequenten Escaping: keine Inline-Skripte/-Handler, keine fremden Quellen.
     'unsafe-eval' ist nötig, weil pywebview Events (evaluate_js) und die js_api per eval()/new Function einspielt.
     'unsafe-inline' nur für Styles (style-Attribute der generierten Thumbnails, Genre-Farben).
     Bilder: lokal (file: auch für das Cover im Mini-Player), data: (Overlays) und Thumbnails von *.ytimg.com (YouTube)
     und *.sndcdn.com (SoundCloud) – sonst nichts.
     Medien: nur lokale Dateien (Mini-Player, kein Streaming); data: einzig für die synthetische Tonfolge des Mock-Modus. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: 'unsafe-eval'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: https://i.ytimg.com https://*.ytimg.com https://*.sndcdn.com; media-src 'self' file: data:; font-src 'self' file:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>HCLoader</title>
<link rel="icon" type="image/png" href="img/icon-32.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body>

<!-- Navigation -->
<nav>
  <div class="logo">
    <h1 class="glitch" data-text="HCLOADER">HC<span>LOADER</span></h1>
    <small data-i18n="app.tagline"></small>
  </div>
  <ul class="nav-list" id="nav">
    <li class="nav-ind" id="nav-ind" aria-hidden="true"></li>
    <li class="nav-item" tabindex="0" data-view="discover" data-icon="search"><span data-i18n="nav.discover"></span></li>
    <li class="nav-item" tabindex="0" data-view="inbox" data-icon="inbox"><span data-i18n="nav.inbox"></span><span class="badge" id="b-inbox" hidden></span></li>
    <li class="nav-item" tabindex="0" data-view="watchlist" data-icon="eye"><span data-i18n="nav.watchlist"></span></li>
    <li class="nav-item" tabindex="0" data-view="downloads" data-icon="download"><span data-i18n="nav.downloads"></span><span class="badge acid" id="b-queue" hidden></span></li>
    <li class="nav-item" tabindex="0" data-view="library" data-icon="library"><span data-i18n="nav.library"></span></li>
    <li class="nav-item" tabindex="0" data-view="log" data-icon="log"><span data-i18n="nav.log"></span></li>
    <li class="nav-item" tabindex="0" data-view="settings" data-icon="gear"><span data-i18n="nav.settings"></span></li>
  </ul>
  <div class="nav-foot">
    <span data-i18n="navfoot.today"></span> <b><span id="nf-today">0</span> / <span id="nf-today-max">–</span></b><br>
    <span data-i18n="navfoot.next"></span> <b id="nf-next">–</b><br>
    <span class="mock-flag" id="mock-flag" data-i18n="app.mock" hidden></span>
  </div>
</nav>

<!-- Ansichten: Inhalt bauen die Dateien unter js/views/ -->
<main>
  <section class="view" id="v-discover"></section>
  <section class="view" id="v-inbox"></section>
  <section class="view" id="v-watchlist"></section>
  <section class="view" id="v-downloads"></section>
  <section class="view" id="v-library"></section>
  <section class="view" id="v-log"></section>
  <section class="view" id="v-settings"></section>
</main>

<!-- Mini-Player (js/player.js): nur sichtbar, wenn etwas geladen ist; bleibt über alle Ansichten bestehen -->
<section class="player" id="player" hidden></section>

<!-- Statusleiste -->
<footer>
  <span class="it"><span class="led off" id="sb-ytdlp-led"></span>yt-dlp <b id="sb-ytdlp">–</b></span>
  <span class="it"><span class="led off" id="sb-deno-led"></span>Deno <b id="sb-deno">–</b></span>
  <span class="it"><span class="led off" id="sb-ffmpeg-led"></span>ffmpeg <b id="sb-ffmpeg">–</b></span>
  <span class="it" id="sb-pot-it"><span class="led off" id="sb-pot-led"></span><span data-i18n="statusbar.po"></span> <b id="sb-pot">–</b></span>
  <span class="it" id="sb-backoff-it"><span class="led off" id="sb-backoff-led"></span><span data-i18n="statusbar.backoff"></span> <b id="sb-backoff">–</b></span>
  <span class="it sc" id="sb-sc-it" hidden><span class="led off" id="sb-sc-led"></span><span>SC</span> <b id="sb-sc">–</b></span>
  <span class="it right"><span class="led off" id="sb-queue-led"></span><span data-i18n="statusbar.queue"></span> <b><span id="sb-queue" hidden>0</span><span id="sb-queue-empty" data-i18n="statusbar.queue_empty"></span><span id="sb-queue-sfx"></span></b></span>
  <span class="it" id="sb-day-it"><span data-i18n="statusbar.today"></span> <b><span id="sb-day">0</span> / <span id="sb-day-max">–</span></b></span>
  <span class="it"><span data-i18n="statusbar.next"></span> <b id="sb-next">–</b></span>
</footer>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="overlays"></div>

<!-- Klassische Scripts (kein ES-Modul: file:// in WebView2), gemeinsamer Namespace window.HC -->
<script src="js/i18n.js"></script>
<!-- Sprachkataloge (docs/TRANSLATING.md): alle per <script>, kein fetch unter file:// -->
<script src="js/locales/en.js"></script>
<script src="js/locales/de.js"></script>
<script src="js/locales/zh-CN.js"></script>
<script src="js/locales/hi.js"></script>
<script src="js/locales/es.js"></script>
<script src="js/locales/fr.js"></script>
<script src="js/locales/bn.js"></script>
<script src="js/locales/pt.js"></script>
<script src="js/locales/ru.js"></script>
<script src="js/locales/id.js"></script>
<script src="js/locales/nl.js"></script>
<script src="js/locales/nl-BE.js"></script>
<script src="js/locales/sv.js"></script>
<script src="js/locales/nb.js"></script>
<script src="js/locales/fi.js"></script>
<script src="js/locales/lt.js"></script>
<script src="js/locales/lv.js"></script>
<script src="js/locales/et.js"></script>
<script src="js/locales/de-x-frk.js"></script>
<script src="js/util.js"></script>
<script src="js/bridge.js"></script>
<script src="js/mock.js"></script>
<script src="js/components.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
<script src="js/views/discover.js"></script>
<script src="js/views/inbox.js"></script>
<script src="js/views/watchlist.js"></script>
<script src="js/views/downloads.js"></script>
<script src="js/views/library.js"></script>
<script src="js/views/log.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/updater.js"></script>
</body>
</html>
