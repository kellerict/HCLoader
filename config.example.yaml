# HCLoader - Konfiguration
# Alle Werte sind optional; fehlende Werte nehmen den Standard. Kommentare bleiben erhalten.
# --- Allgemein ---
general:
  # Sprache der Oberfläche: auto (Windows-Sprache), en, de, zh-CN, hi, es, fr, bn, pt, ru, id, nl, nl-BE (Vlaams), sv, nb, fi, lt, lv, et, de-x-frk (Fränggisch)
  language: en
  # Startansicht: discover, inbox, watchlist, downloads, library, log
  start_view: discover
  # Log-Stufe: DEBUG, INFO, WARNING, ERROR
  log_level: INFO
  # Vor dem Löschen aus der Bibliothek nachfragen
  confirm_delete: true

# --- Suche ---
search:
  # Anzahl Treffer pro Suche (1-100)
  results_count: 30
  # Bei Jahr-Filter die Jahreszahl an den Suchbegriff anhängen
  append_year: true

# --- Filter & Keywords ---
filters:
  # Mindestdauer in Sekunden (600 = 10 Minuten)
  min_duration: 600
  # Maximaldauer in Sekunden, 0 = unbegrenzt
  max_duration: 0
  # Upload-Zeitraum: all, 7d, 30d, 1y, year, custom
  upload_period: all
  # Jahr (nur bei upload_period: year), 0 = nicht gesetzt
  upload_year: 0
  # Von-Datum JJJJ-MM-TT (nur bei upload_period: custom)
  upload_from: ''
  # Bis-Datum JJJJ-MM-TT (nur bei upload_period: custom)
  upload_to: ''
  # Include-Keywords: mindestens eines muss im Titel vorkommen (leer = egal)
  include_keywords:
    - mix
    - set
    - liveset
    - live set
    - podcast
    - continuous
    - megamix
    - yearmix
    - radio show
    - session
    - warm up
    - closing
  # Exclude-Keywords: Treffer mit einem dieser Begriffe werden verworfen
  exclude_keywords:
    - reaction
    - tutorial
    - how to
    - shorts
    - trailer
    - aftermovie
    - teaser
    - preview
    - lyrics
    - karaoke
    - sample pack
    - ableton
    - fl studio
  # Keywords auch in der Beschreibung suchen (flache Abfragen liefern sie oft nicht)
  match_description: false
  # Bereits geladene/ignorierte Videos ausblenden
  hide_done_ignored: true
  # Kanal-Blacklist anwenden
  apply_channel_blacklist: true
  # Vermutlich schon von der anderen Plattform geladene Mixes ausblenden (gleiche Dauer +-5 s, ähnlicher Titel)
  hide_cross_platform_duplicates: false

# --- Genres ---
genres:
  # Genres in Prioritätsreihenfolge; 'Unsortiert' ist immer vorhanden
  items:
    - name: Uptempo
      color: '#b6ff00'
      keywords:
        - uptempo
        - up-tempo
        - terror
        - terrorcore
        - speedcore
      priority: 1
    - name: Hardcore
      color: '#ff1f1f'
      keywords:
        - hardcore
        - gabber
        - gabba
        - frenchcore
        - industrial
        - early hardcore
        - millennium
        - mainstream hardcore
      priority: 2
    - name: Hardstyle
      color: '#a43bff'
      keywords:
        - hardstyle
        - rawstyle
        - raw
        - euphoric
        - xtra raw
        - reverse bass
      priority: 3
    - name: Unsortiert
      color: '#6b6b78'
      keywords: []
      priority: 99

# --- Download & Qualität ---
download:
  # mp3 oder original (keine Umwandlung)
  audio_format: mp3
  # MP3-Qualität: 320 (CBR) oder v0 (VBR)
  mp3_quality: '320'
  # Cover (quadratisch zugeschnitten) in die MP3 einbetten
  embed_cover: true
  # Zusätzlich cover.jpg neben die Datei legen
  write_cover_jpg: false
  # CUE-Datei aus Kapiteln erzeugen
  write_cue: true
  # ID3-Kapitel (CHAP/CTOC) einbetten
  write_id3_chapters: true
  # SoundCloud: Original behalten (meist 128-160 kbps; MP3 320 bringt nichts)
  keep_original_soundcloud: true

# --- Ablage & Tags ---
storage:
  # Zielordner; %USERPROFILE% wird ersetzt; relativ (z.B. .\Music) = zum App-Ordner, nur Portable-Version
  target_dir: '%USERPROFILE%\Music\HCLoader'
  # Ordner-/Dateimuster; Platzhalter: genre, artist, channel, year, date, title, id, platform (id bei SoundCloud: sc-<id>), festival, event_year, stage (leer = entfällt)
  path_template: '{genre}/{artist}/{year}/{date} - {title} [{id}]'
  # Maximale Titellänge im Dateinamen (20-200)
  max_title_length: 120
  # Maximale Gesamtpfadlänge (100-259, Windows-Limit)
  max_path_length: 240
  # Artist aus dem Titel ableiten (ARTIST @ EVENT / ARTIST - TITEL)
  artist_from_title: false
  # Album-Tag = Ausgabe (z.B. «Defqon.1 2024»), wenn ein Festival/eine Serie zugeordnet ist
  album_from_edition: true
  # Reguläre Ausdrücke, die aus dem Titel entfernt werden
  title_cleanup_patterns:
    - \(Official[^)]*\)
    - \[HQ\]
    - \[HD\]
    - \(HQ\)
    - \(HD\)
    - \[Official[^\]]*\]

# --- Schonung von YouTube ---
throttle:
  # Pause zwischen Metadaten-Requests in Sekunden (0-60)
  sleep_requests: 3.0
  # Minimale Pause zwischen Downloads in Sekunden
  sleep_interval: 30
  # Maximale Pause zwischen Downloads (>= minimal)
  max_sleep_interval: 120
  # Download-Tempo in MB/s, 0 = unbegrenzt
  limit_rate_mb: 3.0
  # Maximale Downloads pro Lauf (1-100)
  max_downloads_per_run: 10
  # Maximale Downloads pro Tag (1-500)
  max_downloads_per_day: 25
  # Maximale Suchen pro Stunde (1-200)
  max_searches_per_hour: 20
  # Sperrzeit nach HTTP 429 / Bot-Check in Stunden (0.5-168)
  backoff_initial_hours: 6.0
  # Obergrenze der Sperrzeit (Verdopplung bis hierhin)
  backoff_max_hours: 48.0

# --- Netzwerk & PO-Token ---
network:
  # PO-Token: off, script (Deno) oder http (Provider-Server)
  po_token_mode: script
  # Port des PO-Token-Servers (HTTP-Modus)
  po_token_port: 4416
  # Gültigkeit des PO-Tokens in Stunden
  po_token_ttl_hours: 6.0
  # Notlösung: Cookies aus Browser (edge, chrome, firefox, brave); leer = aus
  cookies_from_browser: ''
  # Optionaler Proxy, z.B. http://127.0.0.1:8080
  proxy: ''

# --- SoundCloud ---
soundcloud:
  # SoundCloud: Pause zwischen Metadaten-Requests in Sekunden (0-60)
  sleep_requests: 3.0
  # SoundCloud: minimale Pause zwischen Downloads in Sekunden
  sleep_interval: 30
  # SoundCloud: maximale Pause zwischen Downloads (>= minimal)
  max_sleep_interval: 120
  # SoundCloud: Download-Tempo in MB/s, 0 = unbegrenzt
  limit_rate_mb: 3.0
  # SoundCloud: maximale Downloads pro Lauf (1-100)
  max_downloads_per_run: 10
  # SoundCloud: maximale Downloads pro Tag (1-500)
  max_downloads_per_day: 25
  # SoundCloud: maximale Suchen pro Stunde (1-200)
  max_searches_per_hour: 20
  # SoundCloud: Sperrzeit nach HTTP 429 in Stunden (0.5-168)
  backoff_initial_hours: 6.0
  # SoundCloud: Obergrenze der Sperrzeit (Verdopplung bis hierhin)
  backoff_max_hours: 48.0
  # SoundCloud als zweite Plattform nutzen (Suche, Watchlist, Downloads)
  enabled: true

# --- Zeitplan ---
schedule:
  # Prüfintervall der Watchlist in Stunden (1-168)
  watchlist_interval_hours: 24.0
  # Watchlist auch prüfen, solange die App offen ist
  in_app_check: true
  # Windows-Aufgabenplanung nutzen
  task_scheduler_enabled: false
  # Uhrzeit der geplanten Aufgabe (HH:MM)
  task_time: 03:00
  # Einträge pro Quelle und Prüfung (1-200)
  entries_per_source: 30

# --- Watchlist ---
watchlist:
  # «Alles einlesen (einmalig)»: höchstens so viele Einträge pro Quelle (100-10000)
  backfill_max_entries: 2000
  # «Alles einlesen»: höchstens so viele Seiten-Anfragen pro Stunde (10-600, gleichmässig verteilt; Headless-Lauf: Budget pro Lauf)
  backfill_requests_per_hour: 120

# --- Darstellung ---
appearance:
  # Effekte reduzieren
  reduce_effects: false
  # Scanlines-Overlay anzeigen
  scanlines: true
  # Takt des Fortschrittsbalkens in BPM (60-300)
  pulse_bpm: 200

# --- Wartung ---
maintenance:
  # Beim Start auf yt-dlp-Updates prüfen (max. 1x pro Tag)
  check_updates_on_start: true
  # Beim Start prüfen, ob eine neue HCLoader-Version da ist (GitHub)
  check_app_updates_on_start: true
  # Ein heruntergeladenes App-Update beim Beenden automatisch einspielen
  apply_update_on_exit: true
  # GitHub-Repo für App-Updates (besitzer/repo), für Forks änderbar
  update_repo: kellerict/HCLoader

# --- Player ---
player:
  # Abspielen: internal (eingebauter Player) oder external (Standardplayer von Windows)
  mode: internal
  # Eingebauter Player: Lautheit angleichen (ReplayGain aus der Analyse bzw. den Tags, mit Schutz vor Übersteuern)
  normalize: true
  # Ziel-Lautheit des eingebauten Players in LUFS (-30 bis -6; -18 = ReplayGain-2.0-Referenz)
  target_lufs: -18.0
  # Wiedergabeposition pro Set merken: ask (nachfragen), auto (automatisch fortsetzen), off (nichts merken)
  resume: ask
  # Wellenform als Zeitleiste im Player (sonst einfacher Balken)
  waveform: true

# --- Lautheit & Wellenform ---
loudness:
  # Nach jedem Download Lautheit und Wellenform offline mit ffmpeg berechnen (niedrige Priorität, eine Datei nach der anderen)
  analyse_after_download: true
  # ReplayGain-2.0-Tags in die Dateien schreiben (MP3: TXXX, M4A: Atome, Opus: R128_TRACK_GAIN); nie neu kodieren
  write_tags: true
  # Wellenform bei Analyse/Durchlauf vorberechnen (aus = erst beim ersten Abspielen)
  waveforms: true

# --- Festivals & Serien ---
festivals:
  # Festival/Serie, Jahr, Bühne und Set-Art aus Titel/Kanal erkennen (offline, keine Zusatzanfragen)
  detect: true
  # Mindest-Sicherheit für eine automatische Zuordnung (0.3-1.0); darunter nur Vorschlag
  min_confidence: 0.65
  # Ohne Jahreszahl im Titel das Upload-Jahr nehmen
  year_from_upload_date: true
  # Festivalnamen auch in der Beschreibung suchen (falls gespeichert)
  match_description: true
  # Zusätzliche Bühnennamen (zu RED, BLUE, BLACK, UV, Mainstage …)
  extra_stages: []
  # Zusätzliche Begriffe für Set-Arten: keyword + set_type (live_set, closing_ceremony, opening, endshow, full_show, warm_up, anthem, episode)
  extra_set_types: []
  # Festival-Sammler: höchstens so viele Suchen pro Stunde für fehlende Sets (1-200, gleichmässig verteilt; zusätzlich gilt throttle.max_searches_per_hour)
  collector_searches_per_hour: 10
  # Festival-Sammler: Treffer pro Suche (1-20: eine Anfrage pro Suche, YouTube liefert etwa 20 pro Seite)
  collector_results_per_search: 10
  # Festival-Sammler: ab dieser Sicherheit gilt ein Treffer ohne Bestätigung (0.5-1.0; nur mit DJ, Festival und Jahr im Titel)
  collector_auto_confirm: 0.85
