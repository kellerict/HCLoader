[project]
name = "hcloader"
version = "0.1.0"
description = "Finden, Filtern und lokales Speichern von Hardstyle-/Hardcore-/Uptempo-Mixes als MP3"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp",
    "bgutil-ytdlp-pot-provider",
    "mutagen",
    "pydantic>=2",
    "ruamel.yaml",
    "pywebview",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "playwright"]

[tool.setuptools]
packages = ["app", "app.core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
