[project]
name = "hcloader"
dynamic = ["version"]  # app/__init__.py __version__ (single source of truth)
description = "Finden, Filtern und lokales Speichern von Hardstyle-/Hardcore-/Uptempo-Mixes als MP3"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "yt-dlp[default,curl-cffi]",
    "bgutil-ytdlp-pot-provider",
    "mutagen",
    "pydantic>=2",
    "ruamel.yaml",
    "pywebview",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "playwright"]

[tool.setuptools]
packages = ["app", "app.core"]

[tool.setuptools.package-data]
app = [
  "locales/*.json",  # backend message catalogs (app/core/i18n.py)
  "data/*.yaml",  # built-in festivals & series (app/core/series.py, v0.3.0)
]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not network'"
markers = [
    "network: needs real network access (e.g. PyPI, never YouTube); all other tests are blocked from non-loopback connections (tests/conftest.py)",
]
